name: media-hub

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/jellyfin/config:/config
      - ./config/jellyfin/cache:/cache
      - ${MEDIA_PATH}/Peliculas:/media/Peliculas:ro
      - ${MEDIA_PATH}/Series:/media/Series:ro
      - ${MEDIA_PATH}/Documentales:/media/Documentales:ro
      - ${MEDIA_PATH}/Musica:/media/Musica:ro

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      - TZ=${TZ}
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_SESSIONTIMEOUT=24h
      - ND_LOGLEVEL=info
    volumes:
      - ./config/navidrome:/data
      - ${MEDIA_PATH}/Musica:/music:ro

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "13378:80"
    environment:
      - TZ=${TZ}
    volumes:
      - ${MEDIA_PATH}/Audiolibros:/audiobooks
      - ${MEDIA_PATH}/Podcasts:/podcasts
      - ./config/audiobookshelf/config:/config
      - ./config/audiobookshelf/metadata:/metadata

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=localhost:3000,127.0.0.1:3000
    volumes:
      - ./homepage:/app/config
